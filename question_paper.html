<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Question Paper Maker</title><style>body{margin:0;background:#eef1f5;font-family:Arial,'Noto Sans Devanagari',sans-serif}.app{max-width:1050px;margin:18px auto;padding:15px}.box{background:#fff;padding:18px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 12px #0002}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid #aaa;border-radius:7px;font-size:15px}textarea{min-height:70px}.btn{padding:10px 15px;border:0;border-radius:7px;margin:5px;font-weight:bold;cursor:pointer}.add{background:#198754;color:white}.print{background:#111;color:white}.del{background:#b42318;color:white}.row{display:grid;grid-template-columns:45px 1fr 42px;gap:7px;margin:8px 0}.num{text-align:center;padding:10px;background:#eee;border-radius:6px;font-weight:bold}.paper{width:210mm;min-height:297mm;margin:auto;background:white;padding:15mm 14mm;box-sizing:border-box;position:relative}.watermark{position:absolute;left:0;right:0;top:42%;text-align:center;transform:rotate(-35deg);font-size:55px;font-weight:900;color:#000;opacity:.045;white-space:nowrap}.content{position:relative;z-index:2}.school{text-align:center;font-size:18pt;font-weight:900}.center{text-align:center;font-weight:700}.near{font-size:12pt}.session{margin:6px}.line{border-top:1.5px solid #111;margin:7px 0}.meta{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;font-weight:bold;font-size:11pt}.inst{font-weight:800;font-size:14pt;margin:16px 0 8px}.q{font-size:12.5pt;line-height:1.55;margin:7px 0;break-inside:avoid} @media(max-width:700px){.grid{grid-template-columns:1fr}.paper{width:100%;padding:25px}.meta{grid-template-columns:1fr 1fr}}</style></head><body><div class="app"><div class="box"><h1 style="text-align:center">Question Paper Maker</h1><div class="grid"><div><b>Coaching Name</b><input id="school" value="VIDYA BHAWAN COACHING"></div><div><b>Place</b><input id="place" value="BHAGIRATHPUR, SAMASTIPUR"></div><div><b>Near</b><input id="near" value="NEAR NEW POPULAR ENGLISH ACADEMY"></div><div><b>Session</b><input id="session" value="20____-____"></div><div><b>Subject</b><input id="sub" placeholder="________________"></div><div><b>Class</b><input id="cls" placeholder="________________"></div><div><b>F.M.</b><input id="fm" placeholder="___________"></div><div><b>Time</b><input id="time" placeholder="_____ HR"></div></div><br><b>Instruction</b><input id="inst" value="👉 नीचे दिए गए प्रश्नों के उत्तर दे:-"><br><br><b>Watermark</b><input id="wm" value="VIDYA BHAWAN COACHING"></div><div class="box"><h3>Questions</h3><div id="qs"></div><button class="btn add" onclick="addQ()">+ Add Question</button><button class="btn print" onclick="printPaper()">🖨 Print / Save PDF</button></div><div class="paper" id="paper"><div class="watermark" id="watermark"></div><div class="content"><div class="school" id="ps"></div><div class="center" id="pp"></div><div class="center near" id="pn"></div><div class="center session" id="py"></div><div class="line"></div><div class="meta"><span>SUB:- <u id="p1"></u></span><span>CLASS:- <u id="p2"></u></span><span>F.M. <u id="p3"></u></span><span>TIME:- <u id="p4"></u></span></div><div class="line"></div><div class="inst" id="pi"></div><div id="preview"></div></div></div></div><script>const ids=['school','place','near','session','sub','cls','fm','time','inst','wm'];ids.forEach(id=>document.getElementById(id).addEventListener('input',render));function addQ(t=''){const r=document.createElement('div');r.className='row';r.innerHTML='<div class="num"></div><textarea placeholder="यहाँ प्रश्न लिखें..."></textarea><button class="btn del">×</button>';r.querySelector('textarea').value=t;r.querySelector('textarea').addEventListener('input',render);r.querySelector('.del').onclick=()=>{r.remove();renumber();render()};document.getElementById('qs').appendChild(r);renumber();render()}function renumber(){document.querySelectorAll('.row').forEach((r,i)=>r.querySelector('.num').textContent=i+1+'.')}function v(id){return document.getElementById(id).value}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function render(){ps.textContent=v('school');pp.textContent=v('place');pn.textContent=v('near');py.textContent=v('session');p1.textContent=v('sub');p2.textContent=v('cls');p3.textContent=v('fm');p4.textContent=v('time');pi.textContent=v('inst');watermark.textContent=v('wm');preview.innerHTML='';document.querySelectorAll('.row').forEach((r,i)=>{const t=r.querySelector('textarea').value.trim();if(t){const d=document.createElement('div');d.className='q';d.innerHTML='<b>'+(i+1)+'.</b> '+esc(t).replace(/\n/g,'<br>');preview.appendChild(d)}})}function printPaper(){render();const clone=document.getElementById('paper').cloneNode(true);const w=window.open('','_blank');if(!w){alert('Print window blocked. Please allow pop-ups for this file.');return}w.document.open();w.document.write('<!doctype html><html lang="hi"><head><meta charset="utf-8"><title>Question Paper</title><style>@page{size:A4;margin:0}html,body{margin:0;padding:0;background:#fff}body{font-family:Arial,"Noto Sans Devanagari",sans-serif}.paper{width:210mm;min-height:297mm;padding:15mm 14mm;box-sizing:border-box;position:relative;background:#fff}.watermark{position:absolute;left:0;right:0;top:42%;text-align:center;transform:rotate(-35deg);font-size:55px;font-weight:900;color:#000;opacity:.045;white-space:nowrap}.content{position:relative;z-index:2}.school{text-align:center;font-size:18pt;font-weight:900}.center{text-align:center;font-weight:700}.near{font-size:12pt}.session{margin:6px}.line{border-top:1.5px solid #111;margin:7px 0}.meta{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;font-weight:bold;font-size:11pt}.inst{font-weight:800;font-size:14pt;margin:16px 0 8px}.q{font-size:12.5pt;line-height:1.55;margin:7px 0;break-inside:avoid}</style></head><body></body></html>');w.document.close();w.document.body.appendChild(w.document.adoptNode(clone));setTimeout(()=>{w.focus();w.print();},500)}for(let i=0;i<5;i++)addQ();render();</script></body></html>
